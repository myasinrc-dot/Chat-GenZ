<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChatGenZ</title>
</head>
<body style="background: #e5ddd5; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; width: 100%; box-sizing: border-box;">
        <h2 style="margin-top: 0; color: #075e54;">ChatGenZ</h2>
        <p style="color: #666; margin-bottom: 25px;">Sistem Chat Privat Berbasis PIN</p>
        
        <form method="POST">
            <input type="number" name="nomor_hp" placeholder="Nomor HP (Contoh: 08123...)" required style="padding: 12px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 20px; outline: none; margin-bottom: 15px;">
            <button type="submit" style="padding: 12px 20px; width: 100%; box-sizing: border-box; background: #128c7e; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 15px;">Masuk / Dapatkan PIN</button>
        </form>
    </div>
</body>
</html>
