<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat-GenZ Realtime</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        #chat-container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        #boxChat { list-style-type: none; padding: 0; height: 300px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; border-radius: 4px; margin-bottom: 10px; background: #fafafa; }
        #boxChat li { padding: 8px; margin-bottom: 5px; background: #e2f0cb; border-radius: 4px; word-wrap: break-word; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2>Chat-GenZ Room</h2>
        <ul id="boxChat"></ul>
        
        <div class="input-group">
            <input type="text" id="inputPesan" placeholder="Ketik pesan..." autocomplete="off">
            <button id="btnKirim">Kirim</button>
        </div>
    </div>

    <script>
        // Koneksi Socket.IO ke server dengan transport polling dan websocket
        var socket = io({
            transports: ['polling', 'websocket']
        });

        const inputPesan = document.getElementById('inputPesan');
        const btnKirim = document.getElementById('btnKirim');
        const boxChat = document.getElementById('boxChat');

        // Fungsi kirim pesan
        function prosesKirim() {
            let pesanTeks = inputPesan.value.trim();
            if (pesanTeks !== "") {
                console.log("Mengirim pesan:", pesanTeks);
                socket.emit('kirim_pesan', { pesan: pesanTeks });
                inputPesan.value = '';
            }
        }

        // Event listener saat tombol diklik
        btnKirim.addEventListener('click', prosesKirim);

        // Event listener saat menekan tombol Enter di keyboard
        inputPesan.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                prosesKirim();
            }
        });

        // Menerima pesan dari server dan menampilkannya ke layar
        socket.on('terima_pesan', function(data) {
            console.log("Pesan diterima dari server:", data);
            let itemBaru = document.createElement('li');
            itemBaru.textContent = data.pesan;
            boxChat.appendChild(itemBaru);
            boxChat.scrollTop = boxChat.scrollHeight;
        });
    </script>
</body>
</html>
